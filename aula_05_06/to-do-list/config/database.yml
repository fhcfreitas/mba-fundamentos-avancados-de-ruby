# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: to_do_list_development
  cache:
    <<: *default
    database: to_do_list_development_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: to_do_list_development_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: to_do_list_development_cable
    migrations_paths: db/cable_migrate

test:
  <<: *default
  database: to_do_list_test

production:
  primary: &primary_production
    <<: *default
    database: to_do_list_production
    username: to_do_list
    password: <%= ENV["TO_DO_LIST_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: to_do_list_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: to_do_list_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: to_do_list_production_cable
    migrations_paths: db/cable_migrate
